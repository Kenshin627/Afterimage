name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 portable
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" -DBUILD_TESTING=ON

      - name: Build Release
        run: cmake --build build --config Release --parallel 2

      - name: Run tests
        env:
          # Use the native Windows font database for text rendering tests.
          QT_QPA_PLATFORM: windows
        run: |
          ctest --test-dir build -C Release --output-on-failure --timeout 180
          if ($LASTEXITCODE -ne 0) {
            & ./build/Release/workshop_tests.exe -o build/workshop-results.txt,txt
            $testExitCode = $LASTEXITCODE
            Get-Content build/workshop-results.txt -ErrorAction Continue
            Write-Host "Workshop test exit code: $testExitCode"
            exit 1
          }

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-test-logs
          path: |
            build/Testing/Temporary/
            build/workshop-results.txt
          retention-days: 7

      - name: Package portable application
        run: |
          ./package.ps1 -QtDir $env:QT_ROOT_DIR -BuildDir build -Destination portable
          $required = @('Afterimage.exe', 'Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Widgets.dll',
            'Qt6Network.dll', 'platforms/qwindows.dll',
            'imageformats/qwebp.dll', 'translations/qtbase_zh_CN.qm', 'vcruntime140.dll',
            'msvcp140.dll', 'qt.conf', 'QUICKSTART.txt')
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path portable $file) -PathType Leaf)) {
              throw "Portable package is missing: $file"
            }
          }

      - name: Upload portable ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Afterimage-Windows-x64
          path: portable/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download tested portable application
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Afterimage-Windows-x64
          path: portable

      - name: Create release ZIP
        working-directory: portable
        run: zip -r ../Afterimage-Windows-x64.zip .

      - name: Publish ZIP to release
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" Afterimage-Windows-x64.zip --clobber
          else
            gh release create "$RELEASE_TAG" Afterimage-Windows-x64.zip \
              --verify-tag --generate-notes --title "Afterimage $RELEASE_TAG"
          fi
